---
name: Test Docker Images

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ${{ github.ref }}
        description: Git ref to checkout
      artifact-bundle-prefix:
        type: string
        required: true
        description: Prefix for artifact bundle from build workflow
      version:
        type: string
        required: true
        description: >-
          Image version built by build-images (used as the chart image tag
          override so Emissary runs the locally-loaded image).

permissions:
  contents: read

jobs:
  test-images:
    name: Test ${{ matrix.arch }} Images
    runs-on: ${{ matrix.runner }}
    # A green run takes about 7 minutes. The per-step limits below normally
    # fire first, and still let the diagnostics and cleanup steps run. This
    # ceiling only catches a hang in a step without its own limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install Deps
        uses: ./.github/actions/setup-deps

      - name: Install Pinned Tools
        run: |
          set -euo pipefail
          # Versions live in build-aux/tools.mk. tools/bin goes first in PATH
          # so later steps and the fixtures do not pick up the runner's copies.
          make tools/bin/k3d tools/bin/kubectl tools/bin/helm tools/bin/chainsaw
          echo "${{ github.workspace }}/tools/bin" >> "$GITHUB_PATH"
          tools/bin/k3d version
          tools/bin/kubectl version --client
          tools/bin/helm version
          tools/bin/chainsaw version

      - name: Create k3d cluster
        timeout-minutes: 5
        run: |
          # 8100-8159 is the slot port block (see test/e2e/slots.sh).
          # k3d fixes published ports at creation time, so it's reserved here.
          k3d cluster create test-cluster-${{ matrix.arch }} \
            --api-port 6443 \
            --port "80:80@loadbalancer" \
            --port "443:443@loadbalancer" \
            --port "6789:6789@loadbalancer" \
            --port "8100-8159:8100-8159@loadbalancer" \
            --k3s-arg "--disable=traefik@server:*" \
            --wait

          # Verify cluster is ready
          kubectl cluster-info --context k3d-test-cluster-${{ matrix.arch }}

      - name: Prepare Artifacts Directory
        shell: bash
        run: |-
          mkdir -p ${{ github.workspace }}/artifacts/images

      - name: Download Docker Image Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-bundle-prefix }}-${{ matrix.arch }}
          path: ${{ github.workspace }}/artifacts/images

      - id: load-k3d-images
        name: Load Images into k3d cluster
        timeout-minutes: 5
        run: |
          echo 'Loading images from:'
          ls ${{ github.workspace }}/artifacts/images/

          # Import the image tarballs directly into k3d cluster
          k3d image import ${{ github.workspace }}/artifacts/images/*-${{ matrix.arch }}-image.tar -c test-cluster-${{ matrix.arch }}

          echo "Images imported into k3d cluster"

      - name: Download Helm Chart Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: charts
          path: ${{ github.workspace }}/artifacts/charts

      - name: Install Emissary CRDs
        run: |
          set -euo pipefail
          helm install emissary-crds \
            ${{ github.workspace }}/artifacts/charts/emissary-crds-*.tgz \
            --namespace emissary-system \
            --create-namespace \
            --wait --timeout 3m

      - name: Install Emissary-ingress
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          kubectl create namespace emissary
          helm install emissary-ingress \
            ${{ github.workspace }}/artifacts/charts/emissary-ingress-*.tgz \
            --namespace emissary \
            -f ${{ github.workspace }}/test/e2e/helm-values.yaml \
            --set image.repository=ghcr.io/emissary-ingress/emissary \
            --set image.tag="${VERSION}-${ARCH}" \
            --set image.pullPolicy=IfNotPresent \
            --set replicaCount=1 \
            --set createDefaultListeners=true
          kubectl -n emissary rollout status deploy/emissary-ingress --timeout=3m

      - name: Install Emissary Slots
        timeout-minutes: 10
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # Isolated Emissary instances for fixtures that set global config
          # (Module, AuthService, ...). Same script `make e2e/install` uses.
          ${{ github.workspace }}/test/e2e/slots.sh install \
            "$(echo ${{ github.workspace }}/artifacts/charts/emissary-ingress-*.tgz)" \
            ghcr.io/emissary-ingress/emissary \
            "${VERSION}-${ARCH}"

      - name: Build kat-client
        run: |
          set -euo pipefail
          mkdir -p ${{ github.workspace }}/tools/bin
          go build -o ${{ github.workspace }}/tools/bin/kat-client ./cmd/kat-client

      - name: Run E2E Fixtures
        timeout-minutes: 15
        env:
          E2E_GATEWAY_URL: http://localhost
          KAT_CLIENT: ${{ github.workspace }}/tools/bin/kat-client
          KAT_SERVER_IMAGE: ghcr.io/emissary-ingress/kat-server:${{ inputs.version }}-${{ matrix.arch }}
        run: |
          # One chainsaw shard per slot, run concurrently; see slots.sh.
          ${{ github.workspace }}/test/e2e/slots.sh run \
            ${{ github.workspace }}/tools/bin/chainsaw \
            ${{ github.workspace }}/test/e2e/.chainsaw.yaml \
            ${{ github.workspace }}/test/e2e/fixtures

      - name: Dump Diagnostics on Failure
        if: failure()
        timeout-minutes: 5
        run: |
          kubectl get nodes
          kubectl get ns
          for ns in emissary $(${{ github.workspace }}/test/e2e/slots.sh list | awk '{print "emissary-"$1}'); do
            echo "==================== namespace: $ns ===================="
            kubectl -n "$ns" get all || true
            kubectl -n "$ns" describe pods || true
            for pod in $(kubectl -n "$ns" get pods -o name 2>/dev/null); do
              echo "-------------------- logs: $ns/${pod#pod/} --------------------"
              kubectl -n "$ns" logs "$pod" --all-containers --tail=500 || true
            done
          done

      - name: Cleanup k3d cluster
        if: always()
        run: |
          k3d cluster delete test-cluster-${{ matrix.arch }} || true
